zh_CN:
  site_settings:
    discourse_journals_enabled: "启用期刊插件"
    discourse_journals_category_id: "期刊分类"
    discourse_journals_api_base_url: "上游期刊 API 的基础地址（协议 + 域名）。用于抓取期刊数据以及拼接封面图片的绝对地址。"
    discourse_journals_api_key: "上游期刊 API 的访问密钥（形如 jk_…），在期刊平台管理控制台「API 密钥」页生成。/api/open 下的全部接口都需要它，留空则分析与同步会立即失败。"
    discourse_journals_api_rate_limit: "调用上游 API 的速率上限（每秒请求数）。分析与同步各自共享一个限流器。"
    discourse_journals_cover_sync_rate_limit: "封面同步的速率上限（每秒请求数）。封面同步对每本期刊只发一次轻量的 HEAD 请求，因此可以比 {{setting:discourse_journals_api_rate_limit}} 更快。"
    discourse_journals_comment_author_modifiers: "收录评论匿名作者名的前半部分（修饰词），中英文均可。每条评论按自己的编号固定选一个修饰词和一个 {{setting:discourse_journals_comment_author_nouns}} 拼成名字；同一话题内重名时在后面追加随机大写字母。修改后后台任务会重新生成所有收录评论的名字。"
    discourse_journals_comment_author_nouns: "收录评论匿名作者名的后半部分（名词），中英文均可，与 {{setting:discourse_journals_comment_author_modifiers}} 随机组合。词越多重名越少。"
    discourse_journals_comment_author_suffixes: "收录评论匿名作者名的可选后缀，中英文均可，接在 {{setting:discourse_journals_comment_author_nouns}} 后面。每条评论也可能抽到「无后缀」；留空则名字只有两段。"
    discourse_journals_comment_source_note_enabled: "在收录评论下方显示来源说明（来源站点、原发布时间与原文链接）。关闭后所有收录评论立即隐藏这一行，无需重新同步。"
    discourse_journals_submission_proxy_enabled: "由论坛代理下载上游的投稿须知 / LaTeX 模板。上游这两个地址需要 API 密钥，浏览器无法直接携带，关闭后档案页不再显示下载链接。"
    discourse_journals_title_suffix: "SEO 标题后缀"
    discourse_journals_meta_description: "期刊话题的 meta description 模板。可用占位符: {{summary}}（按影响因子、分区、ISSN、出版商、开放获取、发文与被引等数据自动生成的一段简介）, {{title}}, {{issn}}, {{publisher}}, {{category}}, {{tags}}, {{site_name}}"
    discourse_journals_meta_keywords: "期刊话题的 meta keywords 模板。可用占位符: {{title}}, {{issn}}, {{publisher}}, {{category}}, {{tags}}, {{site_name}}"
    discourse_journals_indexnow_enabled: "期刊被同步新建或内容变化时，通过 IndexNow 通知 Bing 等搜索引擎重新抓取（每 30 分钟批量提交一次）。"
    discourse_journals_close_topics: "保持期刊话题关闭（读者不能回复）。默认关闭此项：同步会让期刊话题保持打开，包括被标记过时的，已关闭的会在下次同步时重新打开。"
    discourse_journals_suggested_mode: "期刊推荐话题模式。default：使用默认推荐；custom_first：优先自定义匹配，不足时补充默认；custom_only：仅显示自定义匹配"
    discourse_journals_suggested_criteria: "匹配条件，用 | 分隔。可选：tags（共享标签）、publisher（相同出版商）、country（相同国家）"
    discourse_journals_suggested_count: "自定义推荐期刊话题的数量"
    discourse_journals_performance_logging: "启用期刊同步和 SEO Hook 的性能日志"
    discourse_journals_major_publishers: "逗号分隔的主要出版商列表。仅匹配这些出版商的期刊会打上出版商标签。"
