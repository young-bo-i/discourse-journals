en:
  site_settings:
    discourse_journals_enabled: "Enable journals plugin"
    discourse_journals_category_id: "Journals category"
    discourse_journals_api_base_url: "Base URL (scheme + host) of the upstream journal API. Used for fetching journal data and for building absolute cover image URLs."
    discourse_journals_api_key: "API key for the upstream journal API (looks like jk_…), generated on the journal platform's API keys page. Every /api/open endpoint requires it; analysis and sync fail immediately when it is blank."
    discourse_journals_api_rate_limit: "Maximum request rate against the upstream API, in requests per second. Analysis and sync each share one limiter."
    discourse_journals_cover_sync_rate_limit: "Maximum request rate of cover sync, in requests per second. Cover sync sends one lightweight HEAD request per journal, so it can run faster than {{setting:discourse_journals_api_rate_limit}}."
    discourse_journals_comment_author_modifiers: "First half (modifier) of collected comments' anonymous author names, Chinese or English. Each comment always combines the same modifier with one of {{setting:discourse_journals_comment_author_nouns}}, picked by its code; a name repeated within a topic gets random capital letters appended. Changing it regenerates every collected comment's name in the background."
    discourse_journals_comment_author_nouns: "Second half (noun) of collected comments' anonymous author names, Chinese or English, combined at random with {{setting:discourse_journals_comment_author_modifiers}}. More words mean fewer repeats."
    discourse_journals_comment_author_suffixes: "Optional suffixes for collected comments' anonymous author names, Chinese or English, appended after {{setting:discourse_journals_comment_author_nouns}}. A comment may also draw no suffix; leave empty for two-part names."
    discourse_journals_comment_source_note_enabled: "Show a source note under collected comments (source site, original publication time and a link to the original). Turning it off hides the note on every collected comment at once, without re-syncing."
    discourse_journals_submission_proxy_enabled: "Proxy submission guideline / LaTeX template downloads through the forum. The upstream URLs require the API key, which a browser cannot send; turning this off hides the download links."
    discourse_journals_title_suffix: "Title suffix for SEO (only in HTML title tag)"
    discourse_journals_meta_description: "Meta description template for journal topics. Placeholders: {{summary}} (a generated overview from impact factor, quartiles, ISSN, publisher, open access, papers and citations), {{title}}, {{issn}}, {{publisher}}, {{category}}, {{tags}}, {{site_name}}"
    discourse_journals_meta_keywords: "Meta keywords template for journal topics. Placeholders: {{title}}, {{issn}}, {{publisher}}, {{category}}, {{tags}}, {{site_name}}"
    discourse_journals_indexnow_enabled: "Notify Bing and other IndexNow search engines when the sync creates or changes a journal, so they recrawl it (submitted in batches every 30 minutes)."
    discourse_journals_close_topics: "Close journal topics after upsert"
    discourse_journals_suggested_mode: "Suggested topics mode for journals. default: use Discourse defaults; custom_first: show custom matches first, fill with defaults; custom_only: only show custom matches"
    discourse_journals_suggested_criteria: "Matching criteria separated by |. Options: tags, publisher, country"
    discourse_journals_suggested_count: "Number of custom suggested journal topics to show"
    discourse_journals_performance_logging: "Enable performance logs for journal sync and SEO hooks"
    discourse_journals_major_publishers: "Comma-separated list of major publishers to tag. Only journals matching these publishers will receive a publisher tag."
