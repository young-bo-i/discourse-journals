        comments:
          heading: "Journal comment sync"
          description: "Fetch submission comments from upstream and post them as replies on the journal topics, in their original order. One collection account posts every reply; each shows its own anonymous author, with its source and original publication time underneath. A full sync goes through every journal that has comments in topic id order and can be paused at any time; if its process restarts, it continues from the checkpoint on its own. Comments already synced are only updated when they change upstream and are never posted twice."
          start_full: "Full sync"
          restart_full: "Restart full sync"
          resume: "Resume"
          pause: "Pause"
          confirm_full: "Start a full comment sync?\n\n- Every journal that has comments is processed in topic id order; its comments are fetched from upstream and posted as replies\n- This takes hours and can be paused at any time; if the process restarts, the sync continues from the checkpoint\n- Journals synced before only get their changed comments updated; nothing is posted twice"
