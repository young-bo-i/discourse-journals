          heading: "Cover sync"
          description: "Sync journal covers from upstream on their own, without touching mapping analysis or apply. Journals with an upstream cover switch to it, and their old local cover is deleted automatically. Journals without one keep the default cover. Stale data left by the old cover system is cleaned up along the way. You can pause and resume from the last checkpoint."
