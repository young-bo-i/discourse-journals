          restart: "Start over"
          resume: "Resume"
          pause: "Pause"
          confirm_start: "Start syncing covers?\n\n- Journals with an upstream cover: switch to it and delete the old local cover\n- Journals without one: keep the default cover\n\nEvery journal is checked upstream one by one, so a full run can take from one to several hours. You can pause at any time."
